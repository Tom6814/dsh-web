# headless 运行器专用 overlay（自动化插件触发 AI 任务时使用）
#
# 只挂浏览器自动化 MCP（Patchright stealth），不含 web 专用插件
# （plugin-market / directory-picker 等），保证 headless profile 可独立解析。
#
# Agent 通过 mcp__browser__browse / interact / extract / close 查看与操作网页，
# 可过基础机器人验证；配合 plugins/automation 的定时任务使用。
- insert:
    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: browser
        command: node
        args: ['/opt/patchright-mcp/dist/index.js']
        cwd: /opt/patchright-mcp
        failOnStartupError: false
