# Zeabur 适配层：插件挂载
#
# ── 1. 插件挂载 ───────────────────────────────────────────────────────────
# github-sync：会话同步到 GitHub（OAuth 绑定 + 按工作区选择仓库/分支）。
# 目录选择：保留官方 directory-picker-auto（云端经 DSH_DIRECTORY_PICKER=browse
# 固定为服务端目录浏览）。不要在这里禁用 auto / 手动插入 browse，官方 auto
# 会成对挂载 backend + client surface，手动拆开会破坏 client 加载顺序。
- insert:
    - id: github-sync
      name: dsh-github-sync
      config: {}

# ── 2. 插件市场 ───────────────────────────────────────────────────────────
# 在「设置 → 插件」中增加「插件市场」tab：
#   - host 端（dsh-plugin-market）：/api/plugin-market/search（代理 GitHub topic:dsh-plugin 搜索）
#     与 /api/plugin-market/install（执行 dsh plugin add）
#   - client 端：注册 settings.plugins.tab 插槽，展示插件卡片并支持一键安装
# 该插件由 Dockerfile / start.sh 安装进 web profile 的 node_modules（包名 dsh-plugin-market）。
- insert:
    - id: plugin-market
      name: 'dsh-plugin-market'

# ── 3. 浏览器自动化（MCP）：Patchright stealth 浏览器 ────────────────────
# Agent 通过 dsh 的 MCP 客户端接入 /opt/patchright-mcp（镜像内置），工具以
# mcp__browser__browse / interact / extract / close 形式出现在 Agent 工具集，
# 可查看与操作网页（Patchright 驱动级 stealth，能过基础机器人验证）。
- insert:
    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: browser
        command: node
        args: ['/opt/patchright-mcp/dist/index.js']
        cwd: /opt/patchright-mcp
        failOnStartupError: false

# ── 4. 自动化：定时触发 AI 执行任务（host 调度 + headless 执行 + UI tab）──
- insert:
    - id: automation
      name: 'dsh-automation'

# ── 5. 图片生成 + 模型增强（对话内生成图片 / OpenAI Responses API / 自定义模型）──
- insert:
    - id: image-gen
      name: 'dsh-image-gen'
- insert:
    - id: model-extras
      name: 'dsh-model-extras'

# ── 6. 技能与 MCP 管理（左侧栏入口：MCP 服务器 + Skills + Cursor 格式导入）──
- insert:
    - id: mcp-skill
      name: 'dsh-mcp-skill'
