# Zeabur 适配层：固定「网页内目录浏览」交互（browse）+ 插件市场
#
# ── 1. 工作区适配 ─────────────────────────────────────────────────────────
# 原理（来自 dsh-web-app bundle 注释 "Mount -browse directly in an overlay"）：
#   auto 选择器只在「本地回环绑定 + 图形会话」时才用 native（系统文件管理器），
#   云端容器应固定 browse。做法：
#   1) 禁用 auto 行（它会在启动时动态二选一）
#   2) 插入 browse 后端（网页内列目录、新建目录）+ 对应的浏览器端 surface，
#      占住 ui-workspace 的目录流插槽
- id: directory-picker
  disabled: true
- insert:
    - id: github-sync
      name: dsh-github-sync
      config: {}

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# ── 2. 插件市场 ───────────────────────────────────────────────────────────
# 在「设置 → 插件」中增加「插件市场」tab：
#   - host 端（dsh-plugin-market）：/api/plugin-market/search（代理 GitHub topic:dsh-plugin 搜索）
#     与 /api/plugin-market/install（执行 dsh plugin add）
#   - client 端：注册 settings.plugins.tab 插槽，展示插件卡片并支持一键安装
# 该插件由 Dockerfile / start.sh 安装进 web profile 的 node_modules（包名 dsh-plugin-market）。
- insert:
    - id: plugin-market
      name: 'dsh-plugin-market'

# ── 3. 浏览器自动化（MCP）：Patchright stealth 浏览器 ────────────────────
# Agent 通过 dsh 的 MCP 客户端接入 /opt/patchright-mcp（镜像内置），工具以
# mcp__browser__browse / interact / extract / close 形式出现在 Agent 工具集，
# 可查看与操作网页（Patchright 驱动级 stealth，能过基础机器人验证）。
- insert:
    - id: mcp-browser
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: browser
        command: node
        args: ['/opt/patchright-mcp/dist/index.js']
        cwd: /opt/patchright-mcp
        failOnStartupError: false

# ── 4. 自动化：定时触发 AI 执行任务（host 调度 + headless 执行 + UI tab）──
- insert:
    - id: automation
      name: 'dsh-automation'

# ── 5. 图片生成 + 模型增强（对话内生成图片 / OpenAI Responses API / 自定义模型）──
- insert:
    - id: image-gen
      name: 'dsh-image-gen'
- insert:
    - id: model-extras
      name: 'dsh-model-extras'

# ── 6. 技能与 MCP 管理（左侧栏入口：MCP 服务器 + Skills + Cursor 格式导入）──
- insert:
    - id: mcp-skill
      name: 'dsh-mcp-skill'
